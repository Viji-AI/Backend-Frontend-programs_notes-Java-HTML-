<html>
  <head>
    <title>Basic CSS layout</title>
    <style>
      /* css */
      body {
        font-family: Arial, Helvetica, sans-serif;
        margin: 0;
      }

      .menu {
        height: 120px;
        background-color: rgb(198, 170, 247);
        text-align: center;
        font-size: 40px;
        font-weight: bold;
        padding-top: 60px;
      }

      .header {
        background-color: yellow !important;
      }

      .sidebar {
        width: 25%;
        height: 400px;
        background-color: lime;
        text-align: center;
        font-size: 40px;
        font-weight: bold;
        padding-top: 100px;
        box-sizing: border-box;
        float: left;
      }
      .content {
        width: 75%;
        height: 400px;
        background-color: brown;
        text-align: center;
        font-size: 40px;
        font-weight: bold;
        padding-top: 100px;
        box-sizing: border-box;
        float: left;
      }
    </style>
  </head>
  <body>
    <div class="menu">Menu</div>
    <div class="menu header">Header</div>
    <div class="sidebar">Sidebar</div>
    <div class="content">Content</div>
    <div class="footer">footer</div>
  </body>
</html>
