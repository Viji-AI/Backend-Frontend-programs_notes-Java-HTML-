<html>
    <head>
        <title>Positioning Task</title>
        <style>
            .Fixed{
                position: fixed;
                 top: 0;
                 left: 0;
                    width: 100%;
                    padding: 15px;
                    background-color: darkblue;
                    color: white;
                    text-align: center;
            }
            .Relative{
                position:relative;
                width: 300px;
                padding: 30px;
                margin-top: 30px;
                border: 2px solid black;
            }
            .Absolute{
                position: absolute;
                top: 10px;
                right: 10px;
                background-color: lightpink;
                color: white;
                padding: 5px 10px;
            }
        </style>
    </head>
    <body>
        <header class="Fixed">Fixed Position</header>
        <h1> Different Positioning </h1>
        <div class="Relative">
            <h2>Relative Position</h2>
            <p class="Absolute">Absolute Position</p>
            <p> This is a relative container</p>
        </div>
    </body>
</html>
