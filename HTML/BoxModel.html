<!DOCTYPE html>
<html>
<head>
    <title>Box Model</title>

    <style>
        .box {
            width: 150px;
            height: 100px;
            background-color: lightblue;
            border: 2px solid blue;
        }

        /* Padding - space inside the box */
        .padding-box {
            padding: 30px;
        }

        /* Margin - space outside the box */
        .margin-box {
            margin: 30px;
        }
    </style>
</head>

<body>

    <h2>Padding Example</h2>

    <div class="box padding-box">
        Padding Box
    </div>

    <h2>Margin Example</h2>

    <div class="box margin-box">
        Margin Box
    </div>

</body>
</html>
