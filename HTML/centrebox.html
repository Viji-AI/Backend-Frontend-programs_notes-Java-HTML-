<!DOCTYPE html>
<html>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <head>
        <title> Centre Box </title>
            <style>
                .child {
                    display: flex;
                    width: 200px;
                    height: 200px;
                    background-color: lightblue;
                    position: absolute;
                    top: 50%;
                    left: 50%;
                    transform: translate(-50%, -50%);
                }
            </style>
        </div>
    </head>
    <body>
        <div class="centrebox"></div>
        <div class="child"></div>
    </body>
</html>
