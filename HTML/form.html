<html>
  <head>
    <title>form</title>
  </head>
  <body>
    <h1>Simple form</h1>
    <form>
      <label>Name:</label>
      <input type="text" placeholder="enter your name" required />
      <br /><br />
      <label>Email</label>
      <input type="email" required />
      <br /><br />
      <label>Password</label>
      <input type="password" />
      <br /><br />
      <label>Age</label>
      <input type="number" readonly />
      <br /><br />
      <input type="number" />
      <br /><br />
      <input type="date" />
      <br /><br />
      <input type="file" />
      <br /><br />
      <input type="checkbox" />
      <br /><br />
      <input type="radio" />
      <br /><br />
      <input type="search" />
      <br />
      <label>Choose course</label>
      <select>
        <option>Select course</option>
        <option>React</option>
        <option>Angular</option>
        <option>.NET</option>
        <option>Java</option>
      </select>
      <br />
      <br />
      <label>Address</label>
      <textarea rows="8" cols="50"> </textarea>
      <br />
      <p>
        Our students come from diverse backgrounds—fresh graduates,
        <span style="color: blue"> career switchers</span> and working
        professionals. With real projects,
      </p>
      <br />
      <button type="submit">Login</button>
    </form>
  </body>
</html>
