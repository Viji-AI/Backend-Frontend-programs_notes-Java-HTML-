<!DOCTYPE html>
<html>
<head>
    <title>Navbar</title>

    <style>
        ul {
            list-style-type: none;
            background-color: black;
            padding: 15px;
            margin: 0;
        }

        li {
            display: inline;
            padding: 15px;
        }

        a {
            color: white;
            text-decoration: none;
            font-size: 18px;
        }

        a:hover {
            color: yellow;
        }
    </style>
</head>

<body>

    <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#">About</a></li>
        <li><a href="#">Services</a></li>
        <li><a href="#">Contact</a></li>
    </ul>

</body>
</html>
